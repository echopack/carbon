name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: carbon
        run: |
          epm install
          echoc test

      - name: carbon-mysql
        working-directory: drivers/mysql
        run: |
          epm install
          echoc test

      - name: carbon-pgsql
        working-directory: drivers/pgsql
        run: |
          epm install
          echoc test

      # macOS ships libsqlite3 with the system
      - name: libsqlite3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: carbon-sqlite
        working-directory: drivers/sqlite
        run: |
          epm install
          echoc test

      - name: carbongen
        working-directory: cli
        run: |
          epm install
          echoc test
