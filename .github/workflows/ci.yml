name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: carbon
        run: |
          epm install
          echoc test

      - name: carbon-mysql
        working-directory: drivers/mysql
        run: |
          epm install
          echoc test

      - name: carbongen
        working-directory: cli
        run: |
          epm install
          echoc test
